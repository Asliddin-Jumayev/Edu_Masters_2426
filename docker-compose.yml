version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: edu_masters_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: edu_masters
      MYSQL_USER: edu_app
      MYSQL_PASSWORD: edu_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./edu_erp
      dockerfile: Dockerfile
    container_name: edu_masters_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: edu_app
      DB_PASSWORD: edu_password_change_me
      DB_NAME: edu_masters
      SECRET_KEY: change-me-to-a-very-secure-random-secret-key-32-chars
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173"
      FRONTEND_URL: "http://localhost:3000"
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: edu_masters_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  backend_uploads:
